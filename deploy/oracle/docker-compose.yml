# ============================================================================
# MakingSmiles — STAGING: frontend en Vercel (CDN) + API y datos en Oracle
# Always Free detrás de Caddy. Escrito de cero para el rebuild por módulos.
#
# Solo Caddy publica puertos (80/443). Postgres, Redis, API y Evolution viven
# en una red interna sin ruta a internet propia; la API se añade a `edge` para
# poder SALIR a internet (LLM, SMTP, Gmail) sin quedar expuesta: `edge` no
# publica ningún puerto de la API.
#
# Este fichero se ejecuta en el servidor desde /opt/makingsmiles (ver
# deploy/oracle/bootstrap-oracle.sh). La imagen de la API la construye GitHub
# Actions y se publica en GHCR; aquí NO hay bloque `build:` a propósito.
# Para construirla a mano desde un checkout del repo:
#   docker build -f deploy/backend.Dockerfile -t ghcr.io/OWNER/makingsmiles-api:local ./backend
#
# Referencia de sintaxis: https://docs.docker.com/reference/compose-file/
# NOTA DE VALIDACIÓN: en el entorno donde se escribió este fichero NO hay
# daemon de Docker, así que `docker compose config` NO se pudo ejecutar.
# Validado solo como YAML con PyYAML y revisado a mano.
# ============================================================================

name: makingsmiles-staging

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 200
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN:?define API_DOMAIN en .env}
      ACME_EMAIL: ${ACME_EMAIL:?define ACME_EMAIL en .env}
      ACME_CA: ${ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
      - backend
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # Endpoint admin de Caddy, escucha solo en loopback dentro del contenedor.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging

  api:
    image: ${API_IMAGE:?define API_IMAGE en .env}
    restart: unless-stopped
    stop_grace_period: 30s
    # Workers configurables: 2 es lo razonable en A1 (2 OCPU); 4 (como el CMD del
    # Dockerfile legacy) sobre-suscribe una instancia de 2 vCPU. Se replica aquí el
    # resto del CMD del Dockerfile (proxy headers, healthcheck de worker, grace).
    command:
      - uvicorn
      - main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - ${API_WORKERS:-2}
      - --timeout-worker-healthcheck
      - "30"
      - --proxy-headers
      - --forwarded-allow-ips
      - "*"
      - --timeout-graceful-shutdown
      - "10"
    mem_limit: ${API_MEM_LIMIT:-4g}
    cpus: ${API_CPUS:-1.5}
    pids_limit: 512
    environment:
      DATABASE_URL: ${DATABASE_URL:?define DATABASE_URL en .env}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SECRET_KEY: ${SECRET_KEY:?define SECRET_KEY en .env}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?define INTERNAL_API_KEY en .env}
      ENVIRONMENT: ${ENVIRONMENT:-staging}
      PUBLIC_FRONTEND_URL: https://${APP_DOMAIN:?define APP_DOMAIN en .env}
      # Base pública con la que la API firma las URLs de /media y los tickets SSE:
      # el navegador las consume CROSS-ORIGIN contra api.<dominio>, no por Vercel.
      PUBLIC_API_URL: https://${API_DOMAIN:?define API_DOMAIN en .env}
      COOKIE_SECURE: "1"
      # Integraciones opcionales del rebuild: vacías = la pila arranca igual y
      # responde /health/db; las funciones que las usan quedan desactivadas.
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY_FREE: ${GEMINI_API_KEY_FREE:-}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      OCR_API_KEY: ${OCR_API_KEY:-}
      TXT_API_KEY: ${TXT_API_KEY:-}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-http://evolution:8080}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:?define EVOLUTION_API_KEY en .env}
      TZ: ${TZ:-Europe/Madrid}
    volumes:
      # Bind mount (no volumen nombrado): el uid del proceso (appuser, 1001) debe
      # poder escribir, y así el operador ve/backupea los ficheros directamente.
      # El bootstrap crea ./media con owner 1001:1001.
      - ./media:/app/media
    networks:
      - backend
      - edge
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # /health/db y no /health: /health encadena la comprobación del LLM y tarda
      # más que el timeout (ver deploy/backend.Dockerfile del repo legacy).
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health/db"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging: *default-logging

  postgres:
    image: postgres:16.14
    restart: unless-stopped
    mem_limit: 2g
    cpus: 0.50
    pids_limit: 256
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?define POSTGRES_DB en .env}
      TZ: ${TZ:-Europe/Madrid}
    shm_size: "256mb"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Solo se ejecuta con pgdata VACÍO (primer arranque): crea la BD de Evolution.
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *default-logging

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.20
    pids_limit: 128
    # Sin persistencia (solo pub/sub y tokens/estado de SSE). noeviction para
    # que el token de SSE no sea desalojado durante su ventana de validez.
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    logging: *default-logging

  evolution:
    # Versión fijada y verificada con arm64 en Docker Hub (API de Hub):
    # https://hub.docker.com/v2/repositories/evoapicloud/evolution-api/tags/v2.3.7
    # `latest` apunta a una release candidate (2.4.0-rc1) a fecha de este fichero.
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    mem_limit: 2g
    cpus: 0.30
    pids_limit: 256
    environment:
      SERVER_URL: http://evolution:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?define EVOLUTION_API_KEY en .env}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: ${EVOLUTION_DATABASE_URI:?define EVOLUTION_DATABASE_URI en .env}
      DATABASE_CONNECTION_CLIENT_NAME: evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DEL_INSTANCE: "false"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/1
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: "false"
      TZ: ${TZ:-Europe/Madrid}
    networks:
      - backend
      # Evolution necesita SALIR a internet: mantiene WSS con los servidores de
      # WhatsApp. Sin `edge` (backend es internal:true) se queda sin egress y la
      # sesión de WhatsApp no conecta. No publica puertos: solo se le alcanza por
      # la red interna.
      - edge
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Comprueba la API autenticada (no solo "/"): exige 200 en
      # /instance/fetchInstances con la apikey. NO verificado en ejecución (sin
      # daemon Docker aquí). La SESIÓN real de WhatsApp (connectionStatus=open) la
      # comprueba check-evolution.sh, no el healthcheck: un staging recién
      # creado puede no tener instancia emparejada todavía.
      test:
        - CMD-SHELL
        - >-
          node -e "const http=require('http');const req=http.request({host:'127.0.0.1',port:8080,path:'/instance/fetchInstances',headers:{apikey:process.env.AUTHENTICATION_API_KEY||''}},res=>{res.resume();process.exit(res.statusCode===200?0:1)});req.on('error',()=>process.exit(1));req.end()"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    logging: *default-logging

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  # Red con salida a internet: solo Caddy y la API. Ningún puerto publicado salvo
  # los de Caddy (80/443).
  edge:
    driver: bridge
  # Red sin ruta a internet: datos y servicios internos.
  backend:
    driver: bridge
    internal: true
